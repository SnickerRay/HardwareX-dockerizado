{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardwarex - Piezas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body>
    <div class="admin-page">
        <header class="admin-header">
            <div class="admin-logo">
                <img src="{% static 'img/Logo.png' %}" alt="Logo Hardwarex" class="logo-image-small">
                <span>Hardwarex</span>
            </div>
            <nav class="admin-top-menu">
                <a href="{% url 'admin_home' %}">Dashboard</a>
                <a href="{% url 'reportes_recientes' %}">Reportes recientes</a>
                <a href="{% url 'tecnicos_admin' %}">Técnicos</a>
                <a href="{% url 'historial_admin' %}">Historial</a>
                <a href="{% url 'equipos_admin' %}">Equipos</a>
                <a href="{% url 'piezas' %}" class="active">Piezas</a>
                <a href="{% url 'asignaciones' %}">Asignaciones</a>
            </nav>
            <a href="{% url 'login' %}" class="btn admin-logout"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a>
        </header>

        <main class="admin-main">
            <section class="page-header admin-header-block">
                <div>
                    <p class="eyebrow">Administrador</p>
                    <h1>Piezas</h1>
                    <p>Control de repuestos y materiales disponibles.</p>
                </div>
                <div class="user-card">
                    <div class="avatar">AD</div>
                    <div class="user-details">
                        <span class="name">Admin</span>
                        <span class="role">Control</span>
                    </div>
                </div>
            </section>

            <section class="wizard-card">
                <div class="parts-list">
                    <div class="parts-row header">
                        <span>Nombre</span>
                        <span>Cantidad</span>
                    </div>
                    <div class="parts-row">
                        <span>Memoria RAM DDR4</span>
                        <span>12</span>
                    </div>
                    <div class="parts-row">
                        <span>Disco SSD 512GB</span>
                        <span>7</span>
                    </div>
                    <div class="parts-row">
                        <span>Teclado Laptop</span>
                        <span>5</span>
                    </div>
                    <!-- Conectar con BD: piezas en stock y cantidades -->
                </div>

                <div class="admin-bottom-actions">
                    <button class="btn primary">Actualizar</button>
                    <button class="btn secondary">Borrar</button>
                    <button class="btn primary">Añadir</button>
                </div>
            </section>
        </main>
    </div>

    <script src="{% static 'js/admin.js' %}"></script>
</body>
</html>
