
name: Pruebas de seguridad HardwareX

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/seguridad-autenticacion

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: HardwareXx
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d HardwareXx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: HardwareXx
      DB_USER: postgres
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verificar configuración Django
        working-directory: backend
        run: python manage.py check

      - name: Ejecutar pruebas automatizadas
        working-directory: backend
        run: python manage.py test tests
